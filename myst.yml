site:
  # Pinned to book-theme v1.4.1 rather than the bare name `book-theme`.
  #
  # The bare name resolves through api.mystmd.org to that repository's `main`
  # branch, so every build silently picks up whatever has been pushed there.
  # That is how consciousness broke on 2026-11-11: article-theme published
  # v2.0.0 on 2026-11-10 and mystmd 1.12.0 cannot prerender it.
  #
  # book-theme published v2.0.0 the same day from the same source commit, but
  # it was checked on 2026-11-12 and builds cleanly, so this project was never
  # broken. The pin is for reproducibility, not a repair: v1.4.1 is what the
  # last published build (2026-10-28) used, so pinning changes nothing visible
  # while removing the chance of an unannounced theme release breaking it.
  #
  # Switching to v2.0.0 (08951401) is a safe deliberate upgrade when wanted.
  template: https://github.com/myst-templates/book-theme/archive/23f2df5493e23dfb1d9433c8aa64c87beb4232a3.zip
