site:
  # Pinned to book-theme v2.0.0 (39551f85, 2026-11-12) rather than the bare
  # name `book-theme`.
  #
  # The bare name resolves through api.mystmd.org to that repository's `main`
  # branch, so every build silently picks up whatever has been pushed there.
  # That is how consciousness broke on 2026-11-11: article-theme published
  # v2.0.0 on 2026-11-10 and mystmd 1.12.0 cannot prerender it. book-theme
  # main has itself moved twice since -- 08951401 on 11-10 and 39551f85 on
  # 11-12, both tagged v2.0.0 from different source commits.
  #
  # This was pinned to v1.4.1 first, for consistency with the article-theme
  # projects. book-theme v2.0.0 is not broken, though, and v1.4.1 renders less
  # of the content, so the pin is moved up deliberately rather than held back.
  # pano-docs is on this same commit.
  template: https://github.com/myst-templates/book-theme/archive/39551f85e7540f44b3b7e1341b4fd4ca236621dc.zip
